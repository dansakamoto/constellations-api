services:
  web:
    build:
      context: .
      dockerfile: ./dev.dockerfile
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: /app
        - action: rebuild
          path: pyproject.toml

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
